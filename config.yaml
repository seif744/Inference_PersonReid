# =============================================================================
# config.yaml -- all the knobs for the pipeline. main.py reads this at startup.
# =============================================================================

source:
  # Default videos (one entry per camera; each gets its own detector/tracker and
  # crops folder). These are just the DEFAULTS -- override them at runtime with
  #   python main.py --videos a.mp4 b.mp4        (or)   --videos-dir /path
  # so you never have to edit this file to process different footage.
  videos:
    - name: cam_219
      path: placeholder_video/rtsp__219.avi
    - name: cam_224
      path: placeholder_video/rtsp__224.avi
  # 0 = process the whole video. Set e.g. 60 for a quick CPU smoke test.
  max_frames: 0
  # 0 = native resolution. Positive width downscales every frame (keeps aspect)
  # before detect/track/crop/embed. QHD (2560px) on CPU is very slow; 1280 is a
  # big speedup for dev with little ReID cost. Use 0 for a final full-res run.
  resize_width: 0

  # STREAM URLs (rtsp:// / http:// ...) are handled by the real-time pipeline in
  # src/live/ -- see the `live:` block below for its capture/reconnect settings.
  # A run uses the live pipeline when run.mode is `live`, or when run.mode is
  # `auto` and ANY source is a URL. File inputs use the file-batch flow.

detector:
  model: yolo11n.pt          # small YOLO; auto-downloaded on first run
                             # If small objects get misclassified (a bag read as a
                             # person), that is detector CAPACITY, not a threshold:
                             # step up to yolo11s.pt (~3x the FLOPs of 11n) before
                             # yolo11m.pt (~10x) and re-check scheduler util% in the
                             # live metrics summary before keeping it.
  confidence_threshold: 0.4  # drop boxes less confident than this
  iou: 0.60                  # NMS overlap threshold. Was previously UNSET, silently
                             # inheriting Ultralytics' 0.7 default -- a load-bearing
                             # value that deserves to be visible. LOWER suppresses
                             # MORE aggressively => fewer duplicate boxes on one
                             # person. Do NOT raise this to fix duplicates; raising
                             # it produces more of them (it only helps the opposite
                             # failure, one box merging two people).
  person_class_id: 0         # COCO class 0 = person

  # Per-camera overrides for anything above (angle, distance and lighting differ
  # per view, so a single global floor is wrong for every camera by a different
  # amount). Merged over the global values by detector.resolve_detector_cfg, which
  # BOTH the live and file-batch paths call, so the two can never drift.
  # Keys are camera names as they appear in source.videos / auto-named cam_<octet>.
  # Empty = every camera uses the global values above. Example:
  #   per_camera:
  #     cam_224:
  #       confidence_threshold: 0.50   # close view: afford a higher floor
  #     cam_213:
  #       confidence_threshold: 0.35   # wide/high view: small, partly-occluded people
  per_camera: {}
  # Pose ensemble: when the box tracker merges two overlapping people into ONE
  # box (e.g. crops/id_0008), a second pose model finds one skeleton per person
  # and we split the box into individual people. Runs a 2nd model per frame.
  pose_ensemble:
    enabled: true
    pose_model: yolo11n-pose.pt   # auto-downloaded on first run
    min_containment: 0.6          # a pose body must be >= this fraction inside a
                                  # tracker box to count as "in it" (split needs 2+)
    conf: 0.25                    # pose model confidence floor

tracker:
  enabled: true
  config: bytetrack.yaml     # ships with ultralytics; "botsort.yaml" also works

crops:
  # On-disk crop saving is DISABLED in the code (crop_saver.py writes nothing).
  # The ReID path never needs on-disk crops -- the embedder makes its own
  # in-memory crop. Leave save: false. Setting it true only constructs the
  # (in-memory, discarded) crop helper; it does NOT write files. Re-add a real
  # consumer for the returned crops before relying on this to collect data.
  save: false
  dir: crops
  interval: 10               # crop-helper throttle (frames between crops per track)
  padding: 0

reid:
  enabled: true
  # OSNet-AIN person-ReID weights: same torchreid OSNet family as before, with
  # Adaptive Instance Normalization for better generalization to unseen (this
  # project's out-of-domain CCTV) footage. Swapped from plain osnet_x1_0 because
  # that model's embeddings weren't discriminative enough on this footage
  # (same-person cross-camera ~0.72 vs different-person ~0.55 -- too close).
  # Multi-source domain-generalization checkpoint (trained on Duke+Market+CUHK03,
  # evaluated on MSMT17 as the unseen domain) from the torchreid Model Zoo.
  weights: src/reid/weights/osnet_ain_x1_0.pth
  device: auto               # auto | cpu | cuda | cuda:N -- same vocabulary as
                             # live.run.device, resolved by the same helper
                             # (src/live/capabilities.py::detect_device), so
                             # "auto" means GPU when one is visible and CPU
                             # otherwise, and asking for cuda on a box without
                             # one falls back to cpu with a warning instead of
                             # failing later mid-run.
                             # SCOPE: this sets the device for the OSNet ReID
                             # model on the FILE-BATCH path only. YOLO
                             # detection/pose never receive a device
                             # (src/detector.py), so Ultralytics picks CUDA on
                             # its own whenever a GPU is visible. That is why
                             # "auto" is the sensible default here: a hardcoded
                             # cpu would put detection on the GPU and ReID on
                             # the CPU in the same run. The live path takes its
                             # ReID device from live.run.device, not this key.
  interval: 10               # re-embed a given track at most once every N frames
  ttl: 300                   # forget a track from the cache after N unseen frames
  warmup_embeddings: 3       # embed the first N successful observations of a new track
  # Cap on how many embeddings ONE track_id contributes over its life (0 = off).
  # A stable track's global id is ALREADY decided once and never re-matched (see
  # identity/service.py: the (camera, track_id) -> global_id cache), so occlusion
  # cannot flip a track's id regardless of this knob. This cap is a separate
  # PRODUCTION lever: it stops re-embedding a settled track, saving forward passes
  # and keeping later (occluded) frames out of the gallery -- valuable when tracks
  # run for minutes across hundreds of cameras.
  #   TRADE-OFF (measured on the sample clip): fewer views -> weaker per-track
  #   prototype -> the borderline cross-camera match (cosine ~0.87 vs threshold
  #   0.85) is LOST. So it defaults OFF; only enable it for long-track / high-
  #   camera-count deployments, and keep it >= reconcile.min_tracklet_observations.
  max_embeddings_per_track: 0
  quality:
    enabled: true            # reject bad crops before embedding/storing
    min_width: 24
    min_height: 64
    min_area: 2500
    min_box_area_ratio: 0.002
    min_blur: 20.0           # Laplacian variance; raise if blurry crops leak in
    min_brightness: 20.0
    max_brightness: 235.0
    min_aspect: 0.20         # width / height
    max_aspect: 1.20
    max_occlusion_ratio: 0.5 # reject a crop if another person's box covers more
                             # than this fraction of it (multi-person crop).
                             # Tried tightening to 0.35 after the osnet_ain_x1_0
                             # swap to fight a rare occlusion-triggered false
                             # merge, but it measurably hurt overall accuracy
                             # (97% -> 89%) by rejecting too many real crops.
                             # Reverted -- see identity.verification comments.

# Vector store (Qdrant). Inference owns this gallery end-to-end: it writes
# embeddings AND assigns identities against it -- no separate registration step,
# no external service. This is the ONLY store the pipeline uses.
store:
  enabled: true
  path: qdrant_data          # persistent LOCAL Qdrant folder (dev / single process)
  # For PRODUCTION, point at a Qdrant SERVER instead of the local folder. Set the
  # url here (non-secret) OR via the QDRANT_URL env var; when a url is present it
  # overrides `path`. The API key is a SECRET -- read only from the QDRANT_API_KEY
  # env var (see .env), never from this committed file.
  url: http://localhost:6333 # local Docker Qdrant server; clear this to use path

# Identity Service (Stage 7): turns stored embeddings into stable global ids,
# merging tracks/cameras that are the same person into one identity.
identity:
  enabled: true
  threshold: 0.63 # cosine to accept a match (used only when verification.enabled
                             # is false, below). CALIBRATE per deployment -- measured
                             # on this project's footage with osnet_x1_0_msmt17:
                             # different people's prototype cosine tops out ~0.57,
                             # genuine cross-video same-person matches reach 0.70-0.80.
                             # Re-measure (see src/identity/demo_identity.py's sweep)
                             # if the ReID weights or camera domain change. Left at
                             # 0.63 after the osnet_ain_x1_0 swap: raising it to 0.68
                             # alongside the verifier changes below measurably hurt
                             # accuracy (97% -> 89%) and was reverted. Note this knob
                             # isn't even on the live decision path while
                             # verification.enabled is true, below -- see there.
  top_k: 50                  # nearest candidates to consider before deciding
  bank_size: 20              # recent good embeddings kept per global identity
  min_score_gap: 0.03        # best identity must beat runner-up by this much

  # ADR-002 Upgrade 1: camera-aware re-ranking (real k-reciprocal + Jaccard,
  # CVPR'24 CA-Jaccard) over identity prototypes, between raw KNN candidate
  # retrieval and the accept/reject decision. See src/identity/reranking.py.
  rerank:
    enabled: true
    k1: 8                          # neighbourhood size for reciprocal-set construction
    cross_camera_k1_boost: 4       # widen k1 by this much for cross-camera reciprocity
                                    # checks, since cross-camera similarity runs lower
    lambda_: 0.7                   # final_score = lambda*cosine + (1-lambda)*(1-jaccard_dist)

  # ADR-002 Upgrade 2: verification layer. Replaces the rigid
  # threshold+min_score_gap gate with a scored combination of signals. This is a
  # HEURISTIC (hand-set weights) for now -- every decision's feature vector is
  # logged to log_path so a real MLP/GBT can be trained on accumulated
  # deployment data later, with no change to the calling code.
  # See src/identity/verifier.py.
  verification:
    enabled: true
    accept_threshold: 0.55   # P(same identity) must clear this to accept. Tried
                             # raising to 0.62 after the osnet_ain_x1_0 swap (to
                             # fight a rare occlusion-triggered false merge), but
                             # it measurably hurt overall accuracy (97% -> 89%,
                             # more false splits) and was reverted. The false
                             # merge is better fixed at its root cause (bad crop
                             # during occlusion) than by raising the global bar.
    min_prob_gap: 0.05       # winner must beat runner-up P(same) by this much.
                             # Same revert as accept_threshold above.
    log_path: logs/verification_decisions.jsonl

  # Offline reconciliation (Stage 7b): after ALL cameras finish, rebuild global
  # ids from camera-local tracklets and merge the ones that are the same person
  # across cameras -- e.g. someone who entered two cameras at the same instant,
  # which the sticky live decision cannot catch.
  reconcile:
    enabled: true
    threshold: 0.63          # prototype cosine to merge cross-camera; blank = use
                             # identity.threshold. Set explicitly here because this
                             # runs independently of the verifier (see verifier.py) --
                             # it must be recalibrated whenever identity.threshold is.
                             # Left at 0.63 after the osnet_ain_x1_0 swap -- see
                             # identity.threshold comment above for why the raise
                             # to 0.68 was reverted.
    same_camera_threshold: 0.90  # stricter merge for fragmented tracks in one camera.
                                 # GLOBAL DEFAULT -- per_camera below overrides it.

    # PER-CAMERA same-camera bars (REMEDIATION_PLAN.md #40). Only
    # `same_camera_threshold` is honoured here; any other key is IGNORED with a
    # warning (see reconcile.resolve_same_camera_thresholds), because `threshold` is
    # a property of a camera PAIR and the rest are whole-run settings. Camera names
    # are the runtime names -- stream URLs are auto-named cam_<last-IP-octet>, so
    # replacing a camera renames it and this block must follow. A name that produces
    # no tracklets is reported in the reconcile log rather than silently ignored.
    #
    # WHY THIS IS NOT ONE GLOBAL NUMBER. Measured on run 20260730_093723 (286
    # decisions, 4 cameras) with the analyser in tests/calibration: the per-subject
    # same/different boundaries OVERLAP across cameras -- p95 of the "top different"
    # score (0.816) is ABOVE p5 of the "worst same" score (0.719) -- so no single
    # bar separates cleanly. Eligible same-camera partners per subject at 0.90:
    #
    #     cam_206: 9.0 (55 subjects,  6 with none)   <- 0.90 works here
    #     cam_224: 0.5 (17 subjects, 12 with none)
    #     cam_219: 0.3 ( 6 subjects,  4 with none)
    #     cam_213: 0.0 (11 subjects, 11 with none)   <- ZERO merges, ever
    #
    # A camera with no same-camera merging cannot join one person's front-view and
    # back-view fragments, so each fragment is absorbed cross-camera into a
    # DIFFERENT cluster: that is the observed "reid 2 by his front, reid 7 by his
    # back" in cam_213 and "reid 3 becomes reid 7 at a bad angle" in cam_224.
    # 37% of all subjects had no eligible partner; the highest score the bar
    # rejected was 0.899.
    #
    # cam_219 is deliberately LEFT at the global 0.90 even though it also orphans
    # (4 of 6): it has only 7 tracklets, mean 264 observations each, so it has
    # little fragmentation to repair and changing it would confound this run's
    # comparison. Move it only after diffing this run against the previous one.
    #
    # These two values are a HYPOTHESIS from one run, not a calibration (decision
    # D9). Change ONE thing, re-run, and diff the analyser's sections 1/2/5:
    #   python tests/calibration/analyze_decision_log.py logs/reconcile_decisions_<run_id>.jsonl
    per_camera:
      cam_213:
        same_camera_threshold: 0.80   # 11/11 subjects orphaned at 0.90
      cam_224:
        same_camera_threshold: 0.80   # 12/17 subjects orphaned at 0.90

    min_tracklet_observations: 3  # a real identity needs >= this many observations;
                                   # shorter tracks are detector noise, not people
    require_reciprocal_best: true      # merge a pair only if they are each other's best
                                       # match -- stops look-alike over-merging on
                                       # weak/out-of-domain models. See reconcile.py.

    # ---- Phase 1 instrumentation (REMEDIATION_PLAN.md) ----------------------
    # Records EVERY merge decision -- accepted and rejected alike -- with all six
    # gates evaluated independently (no short-circuiting) and the full annotated
    # candidate vector. Purely diagnostic: it changes no decision, which
    # tests/live/test_phase1_decision_log.py asserts by comparing the reconciled
    # result with and without a log attached.
    #
    # Before this existed reconcile emitted four log lines, all of them successes,
    # so "why did this merge NOT happen" was unanswerable -- which is why four
    # rounds of threshold tuning were reverted without learning anything.
    #
    # <run_id> is substituted with the run timestamp. Blank/null disables logging.
    decision_log: logs/reconcile_decisions_<run_id>.jsonl

    top2_margin:
      # Runner-up margin: "is there a UNIQUELY plausible match", which is a
      # different question from the absolute threshold's "is there a plausible
      # match". Reconcile has never had this rule (reciprocal-best fills the role),
      # so it ships INERT and is enabled only once the logged distribution shows it
      # rejects something reciprocal-best does not. See REMEDIATION_PLAN.md Phase 9.
      threshold: null        # null = computed and logged, ENFORCES NOTHING
      # Which variant would gate if a threshold were set. Exactly one can ever
      # gate -- there is no way to express "both" -- because gating on two margins
      # at once makes the system much harder to reason about and tune.
      #   eligible    -- runner-up over candidates that survived the
      #                  ranking-independent hard constraints (selection safety:
      #                  a candidate that can never be picked should not suppress
      #                  a good merge)
      #   all_scored  -- runner-up over everything above the floor (evidence
      #                  quality: a near-tie means the embedding cannot separate
      #                  the two, whether or not the runner-up is available)
      # Both are ALWAYS logged regardless; this only picks the one that could gate.
      basis: eligible

display:
  show_window: false         # true = OpenCV windows; false = headless. Only the
                             # file-batch flow uses this; the live pipeline is
                             # headless (its deliverable is output_<cam>.mp4).
  save_annotated: true       # write output_<name>.mp4 with boxes + ids
  window_scale: 1.0
  output_fps: 20.0           # fps for the saved/annotated output videos. Not read
                             # from the source (a file run uses this regardless of
                             # the source's real fps).

# =============================================================================
# REAL-TIME LIVE PIPELINE (src/live/). Handles STREAM sources (and files under
# --mode live): per-camera capture -> scheduler -> inference -> identity ->
# render -> writer, all threaded and load-shedding for real time. On stop it
# runs the offline reconcile (live.reconcile) to settle correct cross-camera ids
# and re-render output_<cam>.mp4. SEPARATE from the file-batch flow above; when
# the file-batch path runs (batch mode, or auto with file inputs) nothing here
# executes.
# =============================================================================
live:
  run:
    mode: auto              # live (always the live pipeline) | auto (live if any
                            # source is a stream URL, else file-batch) | batch
                            # (file-batch; stream URLs are rejected)
    device: auto            # auto (GPU if available else CPU) | cuda:0 | cpu
    max_duration_sec: 0     # 0 = until stopped (q / Ctrl-C)
  capture:
    nvdec: auto             # auto | on | off. NVDEC decode is a SERVER task; CPU
                            # decode is used until a GPU decode lib is available.
    reconnect_attempts: 5
    reconnect_base_delay: 1
    reconnect_max_delay: 30
    max_frame_staleness_ms: 100   # scheduler skips frames older than this
  inference:
    max_batch_size: 8       # forced to 1 on CPU (device-aware)
    t_batch_ms: 40          # dispatch a batch at max_batch_size OR this timeout.
                            # Raised 15->40 for Stage 2: a ~40ms window gathers a
                            # frame from EACH camera into one batch so they can be
                            # processed CONCURRENTLY (one worker per camera). Still
                            # well under one frame period; adds negligible latency.
    max_inference_queue: 2
                            # NOTE: `max_skip_cycles` used to sit here, documented as a
                            # "scheduler starvation bound". NOTHING in the code ever read
                            # it -- BatchScheduler has no rotation state. Removed rather
                            # than implemented, because the scheduler is already fair by
                            # construction (measured 33.3/33.3/33.4% across 3 cameras at
                            # max_batch_size=1): slot.get() CLEARS the slot, so a
                            # just-served camera is empty on the next pass and the next
                            # camera wins. A redundant bound would add state for nothing.
    max_workers: 0          # Stage 2 inference parallelism. 0 = one worker per camera
                            # (recommended). Each worker owns a camera's detector +
                            # ByteTrack; the shared ReID extractor is lock-serialised.
    pose_ensemble: false    # LIVE ONLY. false = skip the 2nd (pose) detection model
                            # per frame -> ~2x detection throughput -> far fewer dropped
                            # frames -> stabler ByteTrack -> less identity fragmentation.
                            # The pose model only splits merged 2-people boxes; the
                            # throughput win matters more while inference is the choke.
                            # Batch path is unaffected (it reads detector.pose_ensemble).
                            # Re-enable once Stage 2 batched inference restores headroom.
  identity:
    max_queue: 64           # bound of the identity input queue AND of each
                            # per-camera lane in the anti-starvation fair buffer
    assign_latency_budget_ms: 5
    min_evidence_obs: 3     # evidence gate before ASSIGNED (never assign on 1st obs)
    same_camera_threshold: 0.70   # same-camera lane: cold reactivation of a dropped
                                  # then re-acquired track. Lowered 0.90 -> 0.85 from
                                  # A100 run #4: 29/42 same-camera reacquisitions failed
                                  # JUST under 0.90 (max 0.898) -> the person minted a new
                                  # id instead of reclaiming theirs = fragmentation, which
                                  # also crowds cross-camera matching. Co-present false
                                  # merges are separately blocked by the co-active veto, so
                                  # lowering this is safe for the on-screen case. Tune from
                                  # the same-cam reacquire histogram in the run summary.
                                  #
                                  # Lowered again 0.85 -> 0.70 from RTSPS run 20260729_162934
                                  # (3 cams, 90.6s, cuda:0). The SAME failure repeated one
                                  # notch down: attempts=22 ok=7 rejected_below_thr=15,
                                  # max_rejected 0.841 -- just under 0.85 again. Histogram
                                  # [<.5:1 .5-.6:1 .6-.7:2 .7-.8:8 .8-.9:4 .9+:6] puts the
                                  # LARGEST bin at .7-.8, which identity.threshold's
                                  # calibration note (~line 136) identifies as the genuine
                                  # same-person range (different people top out ~0.57).
                                  # 0.85 sat ABOVE the same-person cluster, so live minted
                                  # 25 ids for 7 real people (offline reconcile: 35 tracklets
                                  # -> 7 identities) and on-screen ids flipped on every turn
                                  # and crossing. 0.70 sits below the cluster and still well
                                  # clear of the ~0.57 different-people ceiling.
                                  #
                                  # Why this is stricter in effect than reconcile's 0.90:
                                  # reconcile scores tracklet PROTOTYPES averaged over many
                                  # observations (denoised, 0.905-0.995 in that run), while
                                  # this lane scores a partial live aggregate off noisy
                                  # single crops. Same 0-1 scale, different distributions --
                                  # the two numbers are NOT comparable.
    cross_camera_threshold: 0.60  # cross-camera lane: link the same person across cams.
                                  # Lowered 0.63 -> 0.60 from A100 run #2: 9 real
                                  # cross-camera matches landed just under 0.63
                                  # (max sub-threshold 0.628), while different-person
                                  # prototype cosine tops out ~0.55-0.57, so 0.60 keeps
                                  # a safe margin. Re-check the x-camera line + eyeball
                                  # outputs for false merges after changing.
    accept_margin: 0.03     # cross-camera runner-up margin (ported from identity.min_score_gap)
    bank_size: 20           # exemplar embeddings kept per live identity; scoring
                            # blends the bank MEAN (prototype) with the strongest
                            # single exemplar (medoid-style) -- ported from
                            # identity.bank_size / service.py::_bank_score
    split_contradiction_margin: 0.05
  # OFFLINE reconciliation for the LIVE path -- the "correct-answer-at-the-end"
  # flow. The live RTSP feed is NEVER recorded. During the run each camera's
  # PROCESSED (clean) frames + box geometry are captured to a transient temp clip
  # (._live_src_<cam>.mp4) and every FRESH ReID observation (embedding + bbox +
  # confidence + timestamp) is persisted to the store. On stop (Ctrl-C / sources
  # ended / max_duration) the SAME proven offline reconcile the file path uses
  # rebuilds cross-camera identities and re-renders output_<cam>.mp4 with the
  # CORRECT reids -- same person = same id/colour in every camera. The merge
  # thresholds are taken from identity.reconcile.* (0.63 / 0.90 / reciprocal-best)
  # so a live run and a file run reconcile IDENTICALLY. Set enabled: false to
  # restore the old immediate-on-Ctrl-C live-annotated output (paced WriterStage).
  reconcile:
    enabled: true
    sample_stride: 1        # store every Nth FRESH embedding per track. Fresh
                            # embeddings already arrive only every reid.interval
                            # frames (they are NOT per-frame), so this is a second,
                            # optional subsample on top of that. 1 = keep every
                            # fresh observation (matches the file-batch path).
    keep_frames: false      # delete the transient per-camera processed-frame clips
                            # after the final render. true = keep them for audit.
  output:
    write_video: true
    video_path: output_<cam>.mp4
    codec: h264             # software x264; falls back to mp4v
    pacing: wallclock
    fps_default: 20
    resolution: native
    max_writer_queue: 16
    offline_overlay_after_sec: 3   # after this gap, write CAMERA OFFLINE frames
  metrics:
    log_interval_sec: 10
    report_peaks: true
  # Cross-camera physical-impossibility veto (src/live/topology.py; documented in
  # ARCHITECTURE.md section 8.2 and README section 10). FAIL-OPEN: when
  # disabled or with no edges, appearance alone decides every link, and any
  # camera NOT named below is never blocked. Camera names MUST match the runtime
  # names -- stream URLs are auto-named cam_<last-IP-octet> (see main.py
  # _camera_name_from_source), so the mapping is: camera1=cam_224, camera2=cam_219,
  # camera3=cam_213 (chokepoint), camera4=cam_206.
  topology:
    # Cross-camera physical-impossibility veto -- ENABLED with MEASURED transit
    # times (minimum seconds to physically move between adjacent cameras). During
    # cross-camera matching a candidate identity is PRUNED if less than the
    # shortest-path minimum has elapsed since it was last seen (a person can't
    # teleport): this both cuts cross-camera false-merges AND removes impossible
    # competitors so the reachable true match can win the runner-up margin.
    # Multi-hop pairs auto-sum along the shortest path through the cam_213
    # chokepoint (e.g. cam_206 <-> cam_224 = 3 + 2 = 5s). cam_224 & cam_219 are
    # co-visible (same room, overlapping views) -> 0: no time constraint (the
    # co-active veto handles co-presence). Undirected. Format: [a, b, min_sec].
    #
    # DISABLED after A100 testing: with these cameras the view-to-view handoff is
    # FASTER than the walking distance suggests (adjacent/overlapping fields of
    # view), so a 2-3s minimum pruned the TRUE cross-camera match (linked collapsed
    # 5 -> 1, topology_pruned=508). Min-transit vetoes only work when cameras are
    # far apart with a real gap between views; here they are not. Back to
    # appearance-only. (Set enabled: true only if you separate the cameras.)
    enabled: false
    edges:
      - [cam_224, cam_219, 0]   # same room, co-visible (overlapping views)
      - [cam_224, cam_213, 2]   # room -> chokepoint (measured)
      - [cam_219, cam_213, 2]   # room -> chokepoint (measured)
      - [cam_213, cam_206, 3]   # chokepoint <-> cam 4 (measured; only way in/out)
  limits:
    max_active_identities: 200  # LRU cap on the in-memory active set (bounds memory)
    active_ttl: 300         # SECONDS unseen before a live identity is evicted from
                            # the active set. NOTE: the live engine reasons in
                            # wall-clock seconds (frame.ts), not frames -- frames are
                            # per-camera and get dropped, so they aren't comparable
                            # across the pipeline. Keep this GENEROUSLY larger than a
                            # typical absence: an identity must survive a person's
                            # time off-screen for same-camera cold reactivation and
                            # cross-camera linking to reuse it rather than mint anew.
    queue_warn_pct: 80
    drop_warn_pct: 5
